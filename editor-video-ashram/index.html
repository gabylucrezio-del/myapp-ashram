<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#13120f" />
    <title>Editor Ashram</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;background:#13120f;color:#f6f1e7;font-family:system-ui,sans-serif;padding:24px;text-align:center">
        <section>
          <h1 style="margin:0 0 8px;font-size:32px">Editor Ashram</h1>
          <p style="margin:0;color:#d7ae55">Cargando editor...</p>
        </section>
      </main>
    </div>
    <script>
      window.addEventListener("error", function (event) {
        document.getElementById("root").innerHTML =
          '<main style="min-height:100vh;display:grid;place-items:center;background:#13120f;color:#f6f1e7;font-family:system-ui,sans-serif;padding:24px"><section style="max-width:720px"><h1>Error al cargar Editor Ashram</h1><pre style="white-space:pre-wrap;color:#ffb4a8;background:#211d18;padding:12px;border-radius:8px">' +
          String(event.message || event.error || "Error desconocido") +
          "</pre></section></main>";
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
